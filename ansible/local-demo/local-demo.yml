---
- name: "[LOCAL 1/5] Prepare all local SOC demo nodes"
  hosts: all
  become: yes
  vars_files:
    - local-vars.yml
  tasks:
    - name: Wait for apt lock
      shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - net-tools
          - ca-certificates
          - gnupg
          - lsb-release
          - apt-transport-https
          - software-properties-common
          - python3
          - python3-pip
          - jq
        state: present

    - name: Disable swap for Kubernetes
      shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab
      changed_when: false

    - name: Load Kubernetes modules
      shell: |
        modprobe overlay
        modprobe br_netfilter
      changed_when: false

    - name: Persist Kubernetes modules
      copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          overlay
          br_netfilter

    - name: Configure Kubernetes sysctl
      copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl
      command: sysctl --system
      changed_when: false


- name: "[LOCAL 2/5] Install k3s master"
  hosts: k3s_master
  become: yes
  vars_files:
    - local-vars.yml
  tasks:
    - name: Install k3s server
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_TOKEN="{{ k3s_token }}" sh -s - server --disable traefik --node-ip {{ k3s_master_ip }} --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s API
      shell: k3s kubectl get nodes
      register: k3s_api
      retries: 30
      delay: 10
      until: k3s_api.rc == 0


- name: "[LOCAL 3/5] Join k3s workers"
  hosts: k3s_workers
  become: yes
  vars_files:
    - local-vars.yml
  tasks:
    - name: Install k3s agent
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_URL="https://{{ k3s_master_ip }}:6443" K3S_TOKEN="{{ k3s_token }}" sh -s - agent --node-ip {{ ansible_host }}
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh


- name: "[LOCAL 4/5] Install Suricata IDS on worker1"
  hosts: suricata_nodes
  become: yes
  vars_files:
    - local-vars.yml
  tasks:
    - name: Add Suricata stable PPA
      apt_repository:
        repo: ppa:oisf/suricata-stable
        state: present
        update_cache: yes

    - name: Install Suricata
      apt:
        name: suricata
        state: present
        update_cache: yes

    - name: Enable and start Suricata
      systemd:
        name: suricata
        enabled: yes
        state: started

    - name: Create Suricata demo marker
      copy:
        dest: /opt/suricata-demo-status.txt
        content: |
          Suricata IDS installed for local SOC demo.
          Interface: {{ suricata_interface }}


- name: "[LOCAL 5/5] Install Wazuh agent on demo nodes"
  hosts: wazuh_agents
  become: yes
  vars_files:
    - local-vars.yml
  tasks:
    - name: Add Wazuh GPG key
      shell: |
        curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
      args:
        creates: /usr/share/keyrings/wazuh.gpg

    - name: Add Wazuh repository
      copy:
        dest: /etc/apt/sources.list.d/wazuh.list
        content: |
          deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main

    - name: Update apt cache after Wazuh repo
      apt:
        update_cache: yes

    - name: Install Wazuh agent
      shell: |
        WAZUH_MANAGER="{{ wazuh_manager_ip }}" apt-get install -y wazuh-agent
      args:
        creates: /var/ossec/bin/wazuh-control

    - name: Enable and start Wazuh agent
      systemd:
        name: wazuh-agent
        enabled: yes
        state: started
      ignore_errors: yes

    - name: Create Wazuh demo marker
      copy:
        dest: /opt/wazuh-demo-status.txt
        content: |
          Wazuh agent installed for local SOC demo.
          Manager IP configured: {{ wazuh_manager_ip }}
